<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priyanshu Study Timer</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#04101f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Study Timer" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Priyanshu's personal study timer with focus mode" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --text:#e8e4d9;
      --muted:#97a8c4;
      --teal:#20d1c2;
      --green:#22c55e;
      --yellow:#eab308;
      --red:#ef4444;

      --card:rgba(6, 16, 31, 0.56);
      --card-border:rgba(255,255,255,0.08);
      --input-bg:rgba(7,18,33,0.76);
      --button-bg:#1a2946;
      --button-text:#e8e4d9;
      --quote-bg:rgba(7,18,33,0.70);

      --overlay-dark:rgba(2,8,20,0.52);
      --overlay-top:rgba(2,8,20,0.26);
      --side-light-opacity:0.28;
    }

    /* 🌞 Day mode */
    body.day{
      --text:#0f172a;
      --muted:#334155;
      --card:rgba(255,255,255,0.18);
      --card-border:rgba(255,255,255,0.45);
      --input-bg:rgba(255,255,255,0.28);
      --button-bg:rgba(255,255,255,0.35);
      --button-text:#0f172a;
      --quote-bg:rgba(255,255,255,0.22);

      --overlay-dark:rgba(255,255,255,0.05);
      --overlay-top:rgba(255,255,255,0.02);
      --side-light-opacity:0.16;
    }

    /* Day mode - transparent/glass only when user enables */
    body.day .app{
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.35);
      backdrop-filter: blur(8px) saturate(1.2);
      -webkit-backdrop-filter: blur(8px) saturate(1.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }

    body.day .top{
      background: transparent;
      border-bottom: 1px solid rgba(255,255,255,0.20);
    }

    body.day .bottom{
      background: transparent;
    }

    body.day .hero-title{
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }

    body.day .animated-name{
      color: #fff;
      text-shadow: 0 1px 12px rgba(0,0,0,0.4);
    }

    body.day .hero-sub{
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 6px rgba(0,0,0,0.3);
    }

    body.day #timer{
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    body.day .ring-total-label,
    body.day .tap-note-ring{
      color: rgba(255,255,255,0.80);
    }

    body.day .progress-text{
      color: #20d1c2;
    }

    body.day .wheel-item{
      color: rgba(255,255,255,0.45);
    }

    body.day .wheel-item.near{
      color: rgba(255,255,255,0.75);
    }

    body.day .wheel-item.selected{
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }

    body.day .wheel-selector{
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
    }

    body.day #quoteBox{
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.90);
      border: 1px solid rgba(255,255,255,0.20);
    }

    body.day .main-btn{
      background: rgba(255,255,255,0.20);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.30);
    }

    body.day .settings-btn{
      background: rgba(255,255,255,0.25);
      color: #fff;
    }

    /* Focus mode - hide settings btn, reduce distractions */
    body.focus .settings-btn{
      opacity: 0.85;
      pointer-events: auto;
    }

    body.focus .hero-sub{
      display: none;
    }

    body.focus .tap-note{
      display: none;
    }

    /* Deep night mode overrides */
    body.night{
      --card:rgba(4, 10, 20, 0.76);
      --card-border:rgba(255,255,255,0.05);
      --input-bg:rgba(4, 10, 20, 0.88);
      --button-bg:#10203b;
      --button-text:#e8e4d9;
      --quote-bg:rgba(4, 10, 20, 0.84);
      --overlay-dark:rgba(1,4,10,0.74);
      --overlay-top:rgba(1,4,10,0.42);
      --side-light-opacity:0.14;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      height: -webkit-fill-available;
    }

    html, body{
      width:100%;
      height:100%;
      min-height: -webkit-fill-available;
      overflow:hidden;
      font-family:Arial, sans-serif;
      color:var(--text);
      background: #04101f;
    }

    body{
      position:relative;
      background:#04101f;
      min-height: 100dvh;
      transition:background 0.4s ease, color 0.4s ease;
    }

    body.day{
      background: #b8b0c8;
    }

    .bg{
      position:fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index:0;
      filter:brightness(0.50) saturate(1.02);
      transition:opacity 0.8s ease, filter 0.5s ease;
    }

    body.day .bg{
      filter:brightness(1.0) saturate(1.05);
    }

    body.day .bg-dark{
      background: transparent;
    }

    body.day .side-light.left,
    body.day .side-light.right{
      display: none;
    }

    body.focus .bg{
      filter:brightness(0.28) saturate(0.95) blur(2px);
    }

    .bg-dark{
      position:fixed;
      inset:0;
      z-index:1;
      background:
        linear-gradient(180deg, var(--overlay-top), var(--overlay-dark)),
        radial-gradient(circle at center, rgba(3,12,28,0.08), rgba(3,12,28,0.28));
      transition:background 0.4s ease;
    }

    .side-light{
      position:fixed;
      top:0;
      bottom:0;
      width:18vw;
      min-width:90px;
      max-width:220px;
      z-index:2;
      pointer-events:none;
      opacity:var(--side-light-opacity);
      transition:opacity 0.4s ease;
    }

    .side-light.left{
      left:0;
      background:
        linear-gradient(to right,
          rgba(255,255,255,0.24) 0%,
          rgba(255,255,255,0.12) 18%,
          rgba(255,255,255,0.04) 38%,
          transparent 70%);
      filter:blur(22px);
    }

    .side-light.right{
      right:0;
      background:
        linear-gradient(to left,
          rgba(255,255,255,0.24) 0%,
          rgba(255,255,255,0.12) 18%,
          rgba(255,255,255,0.04) 38%,
          transparent 70%);
      filter:blur(22px);
    }

    body.focus .side-light.left,
    body.focus .side-light.right{
      filter:blur(28px);
    }

    .page{
      position:relative;
      z-index:3;
      width:100%;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 18px 24px;
    }

    .app{
      width:100%;
      max-width:520px;
      max-height:calc(100vh - 48px);
      overflow:auto;
      background:var(--card);
      border:1px solid var(--card-border);
      border-radius:30px;
      box-shadow:
        0 18px 40px rgba(0,0,0,0.26),
        inset 0 1px 0 rgba(255,255,255,0.03);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      transition:background 0.4s ease, border-color 0.4s ease;
    }

    .app::-webkit-scrollbar{
      width:0;
      height:0;
    }

    .top{
      position:relative;
      padding:18px 22px 14px;
      background:
        radial-gradient(circle at top center, rgba(32,209,194,0.12), transparent 42%),
        linear-gradient(to bottom, rgba(255,255,255,0.02), rgba(255,255,255,0));
      border-bottom:1px solid rgba(255,255,255,0.08);
      overflow: visible;
      z-index: 10;
    }

    .settings-btn{
      position:absolute;
      top:14px;
      right:16px;
      width:42px;
      height:42px;
      border:none;
      border-radius:50%;
      background:rgba(7,16,31,0.72);
      color:#fff;
      font-size:20px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 10px rgba(0,0,0,0.22);
    }

    body.day .settings-btn{
      background:rgba(255,255,255,0.52);
      color:#0f172a;
    }

    .settings-panel{
      position:fixed;
      top:0;
      right:0;
      width:270px;
      height: 100vh;
      background:rgba(7,16,31,0.98);
      border-left:1px solid rgba(32,209,194,0.18);
      padding:56px 16px 24px;
      display:none;
      box-shadow:-8px 0 40px rgba(0,0,0,0.6);
      z-index: 9999;
      overflow-y:auto;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: transform 0.3s ease;
    }

    .settings-panel.show{
      display:block;
    }
  
    body.day .settings-panel{
      background:rgba(240,245,255,0.97);
      color:#0f172a;
      border-left:1px solid rgba(0,0,0,0.10);
    }

    .settings-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
      text-align:left;
    }

    .settings-panel select,
    .settings-panel input[type="file"],
    .settings-panel input[type="range"]{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(32,209,194,0.18);
      background:#091425;
      color:#e8e4d9;
      font-size:13px;
      margin-bottom:10px;
      outline:none;
    }

    body.day .settings-panel select,
    body.day .settings-panel input[type="file"],
    body.day .settings-panel input[type="range"]{
      background:#f8fafc;
      color:#0f172a;
      border-color:#cbd5e1;
    }

    .toggle-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      font-size:13px;
      color:var(--text);
    }

    .toggle-row input[type="checkbox"]{
      width:18px;
      height:18px;
      accent-color: var(--teal);
    }

    .hero{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding-top:2px;
    }

    .hero-title{
      font-size:15px;
      letter-spacing:2.5px;
      text-transform:uppercase;
      color:var(--text);
      margin-bottom:6px;
    }

    .name-wrap{
      min-height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .animated-name{
      font-size:30px;
      font-weight:700;
      color:var(--text);
      white-space:nowrap;
      overflow:hidden;
      width:0;
      text-shadow:0 0 10px rgba(255,255,255,0.07);
      animation:
        typing 2.1s steps(18, end) forwards,
        blush 1.8s ease-in-out 1 2.1s forwards;
    }

    .hero-sub{
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
      max-width:320px;
    }

    .bottom{
      padding:16px 22px 24px; /* bottom inner gap */
      text-align:center;
    }

    /* ── Big Ring ── */
    .ring-wrap{
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    .ring{
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .ring-inner{
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      pointer-events: none;
      z-index: 2;
    }

    /* Dark glass inside ring */
    .ring-wrap::before{
      content: "";
      position: absolute;
      width: 162px;
      height: 162px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 38%, rgba(32,209,194,0.06), rgba(3,8,18,0.85) 65%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(32,209,194,0.08);
      box-shadow: 0 0 50px rgba(0,0,0,0.7) inset;
      z-index: 1;
    }

    .progress-text{
      font-size: 13px;
      font-weight: 600;
      color: var(--teal);
      letter-spacing: 1px;
      opacity: 0.85;
    }

    .ring-timer{
      font-size: 42px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 2px;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px rgba(32,209,194,0.25);
      line-height: 1;
    }

    /* Alias #timer to .ring-timer */
    #timer{
      font-size: 42px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 2px;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px rgba(32,209,194,0.25);
      line-height: 1;
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    .ring-total-label{
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .tap-note-ring{
      font-size: 11px;
      color: rgba(150,168,196,0.5);
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .tap-note{
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
      display: none;
    }

    body.focus #timer{
      animation: timerGlow 2.2s ease-in-out infinite;
    }

    @media (max-width: 700px){
      .ring-wrap{ width: 200px; height: 200px; }
      .ring-wrap::before{ width: 140px; height: 140px; }
      #timer{ font-size: 32px; }
      .ring-timer{ font-size: 32px; }
    }

    .input-box{
      display:flex;
      justify-content:center;
      margin-bottom:12px;
    }

    #minutesInput{
      width:230px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(32,209,194,.22);
      background:var(--input-bg);
      color:var(--text);
      text-align:center;
      font-size:16px;
      outline:none;
      -webkit-appearance:none;
      appearance:none;
      box-shadow:
        inset 0 0 12px rgba(0,0,0,.28),
        0 0 12px rgba(32,209,194,.05);
      transition:background 0.4s ease, color 0.4s ease;
    }

    #minutesInput::placeholder{
      color:var(--muted);
    }

    #minutesInput::-webkit-inner-spin-button,
    #minutesInput::-webkit-outer-spin-button{
      -webkit-appearance:none;
      margin:0;
    }

    .btn-row{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-top:2px;
    }

    .main-btn{
      min-width:130px;
      padding:12px 16px;
      border:none;
      border-radius:14px;
      font-size:15px;
      color:var(--button-text);
      background:var(--button-bg);
      cursor:pointer;
      transition:.2s ease;
    }

    .main-btn:hover{
      transform:translateY(-1px);
      box-shadow:0 0 12px rgba(32,209,194,.12);
    }

    .main-btn.primary{
      background:var(--teal);
      color:#07211e;
      font-weight:700;
    }

    .quote-box{
      margin-top:14px;
      padding:12px 14px;
      border-radius:14px;
      background:var(--quote-bg);
      border:1px solid rgba(255,255,255,.05);
      font-size:14px;
      line-height:1.5;
      min-height:46px;
      max-width:420px;
      margin-left:auto;
      margin-right:auto;
      transition:background 0.4s ease;
      color:var(--text);
    }

    .notify{
      position:fixed;
      top:18px;
      left:50%;
      transform:translateX(-50%) translateY(-110%);
      min-width:260px;
      max-width:86vw;
      padding:14px 16px;
      border-radius:16px;
      background:rgba(7,16,31,0.92);
      color:#fff;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 14px 30px rgba(0,0,0,0.3);
      z-index:10;
      transition:transform 0.45s ease, opacity 0.45s ease;
      opacity:0;
      backdrop-filter:blur(10px);
      text-align:center;
      font-size:14px;
    }

    .notify.show{
      transform:translateX(-50%) translateY(0);
      opacity:1;
    }

    body.day .notify{
      background:rgba(255,255,255,0.92);
      color:#0f172a;
    }

    .ring-alert{
      animation: ringPulse 0.9s ease-in-out infinite !important;
    }

    .ring-alert .ring{
      filter: drop-shadow(0 0 20px rgba(32,209,194,0.8)) drop-shadow(0 0 40px rgba(32,209,194,0.4));
    }

    .ring-alert #progressCircle{
      stroke: #20d1c2 !important;
    }

    @keyframes typing{
      from{ width:0; }
      to{ width:230px; }
    }

    @keyframes blush{
      0%{
        color:inherit;
        text-shadow:0 0 0 rgba(255,80,120,0);
        transform:scale(1);
      }
      50%{
        color:#ffd7e4;
        text-shadow:0 0 14px rgba(255,120,160,0.55);
        transform:scale(1.03);
      }
      100%{
        color:inherit;
        text-shadow:0 0 8px rgba(255,120,160,0.16);
        transform:scale(1);
      }
    }

    @keyframes timerGlow{
      0%, 100%{
        color:#f8fafc;
        text-shadow:0 0 6px rgba(255,255,255,0.12), 0 0 14px rgba(32,209,194,0.14);
      }
      50%{
        color:#ffdbe7;
        text-shadow:0 0 10px rgba(255,160,190,0.34), 0 0 22px rgba(32,209,194,0.22);
      }
    }

    @keyframes ringPulse{
      0%  { transform: scale(1);    filter: drop-shadow(0 0 0px rgba(32,209,194,0)); }
      25% { transform: scale(1.07); filter: drop-shadow(0 0 22px rgba(32,209,194,0.8)); }
      50% { transform: scale(1);    filter: drop-shadow(0 0 8px rgba(32,209,194,0.3)); }
      75% { transform: scale(1.07); filter: drop-shadow(0 0 22px rgba(32,209,194,0.8)); }
      100%{ transform: scale(1);    filter: drop-shadow(0 0 0px rgba(32,209,194,0)); }
    }

    @media (max-width: 700px){
      .side-light{
        width:18vw;
        min-width:70px;
      }

      .page{
        padding:16px 14px;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        align-items: flex-start;
        padding-top: max(16px, env(safe-area-inset-top));
      }

      .app{
        max-width:430px;
        max-height: calc(100dvh - 32px);
      }

      #minutesInput{
        width:190px;
      }

      .main-btn{
        min-width:110px;
      }
    }

    /* Landscape mode - single column, compact */
    @media (orientation: landscape){
      .page{
        padding: max(8px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        align-items: center;
      }

      .app{
        max-width: 700px;
        max-height: calc(100dvh - 16px);
        display: flex;
        flex-direction: row;
        border-radius: 24px;
        overflow: hidden;
      }

      /* Left side: top section (name + settings) */
      .top{
        width: 220px;
        min-width: 220px;
        flex-shrink: 0;
        padding: 14px 16px 14px;
        border-bottom: none;
        border-right: 1px solid rgba(255,255,255,0.08);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* Right side: bottom (ring + controls) */
      .bottom{
        flex: 1;
        padding: 10px 16px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
      }

      .ring-wrap{
        width: 160px;
        height: 160px;
        margin-bottom: 8px;
        flex-shrink: 0;
      }

      .ring-wrap::before{
        width: 128px;
        height: 128px;
      }

      #timer{
        font-size: 28px;
      }

      .ring-timer{
        font-size: 28px;
      }

      .progress-text{
        font-size: 11px;
      }

      .ring-total-label{
        font-size: 10px;
      }

      .tap-note-ring{
        font-size: 10px;
      }

      .hero-title{
        font-size: 11px;
      }

      .animated-name{
        font-size: 20px;
      }

      .hero-sub{
        font-size: 11px;
        margin-top: 4px;
      }

      .wheel-selector-wrap{
        max-width: 100%;
      }

      .wheel-selector{
        height: 130px;
      }

      .wheel-drum{
        height: 130px;
        padding: 47px 0;
      }

      .wheel-item{ font-size: 18px; }
      .wheel-item.near{ font-size: 20px; }
      .wheel-item.selected{ font-size: 24px; }

      .wheel-selected-bar{ margin-top: 8px; }

      .quote-box{
        margin-top: 6px;
        font-size: 11px;
        min-height: 28px;
        padding: 6px 10px;
      }

      .main-btn{
        min-width: 90px;
        padding: 10px 12px;
        font-size: 13px;
      }

      .btn-row{
        margin-top: 6px;
        gap: 8px;
      }
    }

    /* Tablet portrait */
    @media (min-width: 700px) and (orientation: portrait){
      .page{
        align-items: center;
        padding: 32px 24px;
      }

      .app{
        max-width: 560px;
        max-height: calc(100dvh - 64px);
      }
    }

    /* ── Scroll Wheel Selector ── */
    .wheel-selector-wrap{
      position: relative;
      margin: 0 auto 14px;
      width: 100%;
      max-width: 340px;
    }

    .wheel-selector{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      height: 180px;
      overflow: hidden;
      border-radius: 18px;
      background: var(--input-bg);
      border: 1px solid rgba(32,209,194,0.18);
      box-shadow: inset 0 0 24px rgba(0,0,0,0.28);
      position: relative;
    }

    .wheel-col{
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
      height: 100%;
    }

    .wheel-label{
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--teal);
      text-transform: uppercase;
      font-weight: 600;
      position: absolute;
      top: 6px;
      left: 0; right: 0;
      text-align: center;
      pointer-events: none;
      z-index: 4;
    }

    .wheel-drum{
      height: 180px;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      width: 100%;
      padding: 72px 0;
      cursor: grab;
    }

    .wheel-drum:active{ cursor: grabbing; }
    .wheel-drum::-webkit-scrollbar{ display: none; }

    .wheel-item{
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 300;
      color: rgba(150,168,196,0.45);
      scroll-snap-align: center;
      transition: color 0.12s, font-size 0.12s, font-weight 0.12s;
      font-family: 'Courier New', monospace;
      user-select: none;
    }

    .wheel-item.near{ color: rgba(150,168,196,0.75); font-size: 28px; }

    .wheel-item.selected{
      color: var(--text);
      font-size: 34px;
      font-weight: 700;
    }

    .wheel-sep{
      font-size: 30px;
      font-weight: 700;
      color: var(--teal);
      padding: 0 2px;
      margin-top: 18px;
      pointer-events: none;
      flex-shrink: 0;
      text-shadow: 0 0 10px rgba(32,209,194,0.5);
    }

    .wheel-selected-bar{
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 36px;
      transform: translateY(-50%);
      background: rgba(32,209,194,0.07);
      border-top: 1px solid rgba(32,209,194,0.25);
      border-bottom: 1px solid rgba(32,209,194,0.25);
      pointer-events: none;
      z-index: 3;
      margin-top: 9px;
    }

    .wheel-fade-top,
    .wheel-fade-bottom{
      position: absolute;
      left: 0; right: 0;
      height: 62px;
      pointer-events: none;
      z-index: 3;
    }

    .wheel-fade-top{
      top: 0;
      background: linear-gradient(to bottom, var(--input-bg) 10%, transparent 100%);
      border-radius: 18px 18px 0 0;
    }

    .wheel-fade-bottom{
      bottom: 0;
      background: linear-gradient(to top, var(--input-bg) 10%, transparent 100%);
      border-radius: 0 0 18px 18px;
    }

    body.day .wheel-fade-top{
      background: linear-gradient(to bottom, rgba(255,255,255,0.30) 10%, transparent 100%);
    }
    body.day .wheel-fade-bottom{
      background: linear-gradient(to top, rgba(255,255,255,0.30) 10%, transparent 100%);
    }

    .input-box{ display: none; }

    @media (max-width: 700px){
      .wheel-item{ font-size: 22px; }
      .wheel-item.near{ font-size: 25px; }
      .wheel-item.selected{ font-size: 28px; }
      .wheel-selector{ height: 160px; }
      .wheel-drum{ height: 160px; padding: 62px 0; }
      .wheel-selected-bar{ margin-top: 9px; }
    }

    /* Run mode: clock-style flow */
    .ring-wrap{
      display: none;
    }

    body.run-mode .ring-wrap{
      display: flex;
      width: min(72vw, 360px);
      height: min(72vw, 360px);
      margin: 6px auto 18px;
    }

    body.run-mode .ring-wrap::before{
      width: min(56vw, 270px);
      height: min(56vw, 270px);
    }

    body.run-mode .wheel-selector-wrap,
    body.run-mode .quote-box{
      display: none;
    }

    body.run-mode .hero{
      display: none;
    }

    body.run-mode .top{
      padding: 0;
      min-height: 0;
      border: none;
      background: transparent;
    }

    body.run-mode .settings-btn{
      display: flex;
      opacity: 1;
      pointer-events: auto;
      top: 14px;
      right: 16px;
    }

    body.run-mode .app{
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      max-width: 560px;
      min-height: min(86vh, 760px);
      padding-top: 12px;
    }

    body.run-mode .bottom{
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 24px;
      gap: 6px;
    }

    body.run-mode #timer,
    body.run-mode .ring-timer{
      font-size: clamp(34px, 7vw, 52px);
      letter-spacing: 1px;
    }

    body.run-mode .progress-text{
      font-size: 15px;
    }

    body.run-mode .ring-total-label{
      font-size: 15px;
    }

    @media (orientation: landscape){
      body.run-mode .app{
        max-width: 620px;
        max-height: calc(100dvh - 24px);
        border-radius: 28px;
      }

      body.run-mode .top{
        width: 100%;
        min-width: 0;
      }

      body.run-mode .bottom{
        overflow: hidden;
      }

      body.run-mode .ring-wrap{
        width: min(48vh, 360px);
        height: min(48vh, 360px);
      }

      body.run-mode .ring-wrap::before{
        width: min(36vh, 270px);
        height: min(36vh, 270px);
      }
    }

  </style>

        <div class="hero">
          <div class="hero-title">Study Timer ⏳</div>
          <div class="name-wrap">
            <div class="animated-name">Priyanshu 🚀</div>
          </div>
          <div class="hero-sub">Focus deeply. Build daily. One timer at a time.</div>

      </div>

      <div class="bottom">
        <!-- Big Unique Ring -->

          <svg class="ring" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">

                <stop offset="100%" stop-color="#22c55e"/>
              </linearGradient>
              <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur"/>

            <circle cx="120" cy="120" r="100"

              fill="none"
              stroke-linecap="round"/>
            <!-- Tick marks -->
            <g id="tickMarks"></g>
            <!-- Progress arc - thick bold -->
            <circle
              id="progressCircle"
              cx="120" cy="120" r="100"
              stroke="url(#ringGrad)"
              stroke-width="18"
              fill="none"
              stroke-linecap="round"
              stroke-dasharray="628.3"
              stroke-dashoffset="0"
              transform="rotate(-90 120 120)"
              filter="url(#glowFilter)"

            <!-- Glowing tip dot -->
            <circle id="tipDot" cx="120" cy="20" r="9" fill="#20d1c2"
              style="filter:drop-shadow(0 0 8px #20d1c2) drop-shadow(0 0 4px #fff)"/>
          </svg>
          <!-- Inner content -->
          <div class="ring-inner">
            <div id="progressText" class="progress-text">100%</div>
            <div id="timer" class="ring-timer">25:00</div>
            <div class="ring-total-label" id="totalLabel">Total 25 min</div>
            <div class="tap-note-ring">Tap to pause</div>

        </div>

        <!-- Scroll Wheel Time Selector -->
        <div class="wheel-selector-wrap">
          <div class="wheel-selector">
            <div class="wheel-col">
              <div class="wheel-label">HH</div>
              <div class="wheel-drum" id="wheelHours"></div>
            </div>
            <div class="wheel-sep">:</div>
            <div class="wheel-col">
              <div class="wheel-label">MM</div>
              <div class="wheel-drum" id="wheelMinutes"></div>
            </div>
            <div class="wheel-sep">:</div>
            <div class="wheel-col">
              <div class="wheel-label">SS</div>
              <div class="wheel-drum" id="wheelSeconds"></div>
            </div>
          </div>
          <div class="wheel-selected-bar"></div>
          <div class="wheel-fade-top"></div>
          <div class="wheel-fade-bottom"></div>
        </div>

        <div class="btn-row">
          <button class="main-btn primary" id="startBtn">Start</button>
          <button class="main-btn" id="restartBtn">Restart</button>
        </div>

        <div id="quoteBox" class="quote-box">Scroll to set time, then Start 🚀</div>
      </div>
    </div>
  </div>
